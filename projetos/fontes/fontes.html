<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap');
        @font-face {
            font-family: 'Medieval';
            src: url(fonts/old_london/Olondon_.otf) format(opentype), url(fonts/old_london/OldLondon.ttf) format(truetype); 
        }

        h1 {
            font: normal normal 3em 'Medieval'
        }

        p {
            font: normal normal 1em 'MedievalSharp'
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>

    <p>Este é um HTML teste usando fontes do Google Fonts e fontes externas baixadas.</p>
</body>
</html>
